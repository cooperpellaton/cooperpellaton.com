---
layout: default
---

<article>
    <h1>{{ page.title }}</h1>
    <p class="post-date">
        <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date_to_long_string }}</time>
    </p>
    {% if page.lyric %}
    <blockquote>
        {{ page.lyric }} <br />
        {{ page.artist }}
        <a rel="nofollow" href=" {{page.genius_link}} " target="_blank"> {{ page.song }}</a>
    </blockquote>
    {% endif %} {{ content }}
</article>
